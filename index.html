const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const FLOOR_COUNTS={4:48,5:73,6:60,7:73,8:64,12:72,14:78,15:102,16:80,17:88,18:68,19:86,20:101,21:88,22:98,23:101,24:85,25:108,26:98,27:88,28:66,29:95,30:88,31:94,32:95,33:81,34:87,35:98,36:101,37:108,38:101,39:101,40:109,41:111,42:94,43:123,44:115,45:120,47:128,49:118,50:163};

const COLLECTIONS=[

document.addEventListener("DOMContentLoaded",async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(session){
    currentUser=session.user;
    showScreen("mainScreen",{replace:true});
    await startApp();
  }else{
    history.replaceState({stepHigher:true,screen:"loginScreen"},"",location.href);
  }

window.addEventListener("popstate",e=>{
  const id=e.state?.stepHigher?e.state.screen:"mainScreen";
  renderScreen(id);

async function login(){const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value,status=document.getElementById("loginStatus");status.className="status";status.textContent="ログイン中...";const{data,error}=await sb.auth.signInWithPassword({email,password});if(error){console.error(error);status.className="status error";status.textContent="ログインできませんでした";return}currentUser=data.user;status.textContent="";showScreen("mainScreen",{replace:true});await startApp();}
async function startApp(){stepsAppliedThisLoad=false;await loadData(false);if(!gameProgress)return;await applySteps();await loadData(true);}
async function applySteps(){if(stepsAppliedThisLoad)return;stepsAppliedThisLoad=true;const status=document.getElementById("appStatus");status.className="status";status.textContent="歩数を反映しています...";const{data,error}=await sb.rpc("apply_unapplied_steps");if(error){console.error(error);status.className="status error";status.textContent="歩数の反映に失敗しました";return}const applied=Number(data?.applied??0),completedTargetId=data?.completed_target_id;if(completedTargetId){const target=allTargets.find(x=>x.id===Number(completedTargetId));status.className="status success";status.textContent=target?`${target.name_ja}を制覇しました！`:"目標を制覇しました！";return}status.textContent=applied>0?`${applied.toLocaleString()}歩を反映しました`:"";}

}
function showScreen(id,options={}){
  renderScreen(id);

async function loadData(keepStatus=false){const status=document.getElementById("appStatus");if(!keepStatus){status.className="status";status.textContent="データを読み込んでいます..."}if(!currentUser){const{data:{user}}=await sb.auth.getUser();currentUser=user}if(!currentUser){showError("ユーザー情報を取得できませんでした");return}
const jpParts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
const yy=Number(jpParts.find(x=>x.type==="year").value),mm=Number(jpParts.find(x=>x.type==="month").value),dd=Number(jpParts.find(x=>x.type==="day").value);
const localDate=new Date(yy,mm-1,dd),fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today=fmt(localDate),yest=new Date(localDate);yest.setDate(yest.getDate()-1);const yesterday=fmt(yest);
const monday=new Date(localDate);monday.setDate(monday.getDate()-((monday.getDay()+6)%7));const weekStart=fmt(monday);const monthStart=`${yy}-${String(mm).padStart(2,"0")}-01`,queryStart=[yesterday,weekStart,monthStart].sort()[0];
let r=await sb.from("daily_steps").select("step_date,steps").eq("user_id",currentUser.id).gte("step_date",queryStart).lte("step_date",today);if(r.error){console.error(r.error);showError("歩数データを取得できませんでした");return}
const ds=r.data??[],stepOf=d=>Number(ds.find(x=>x.step_date===d)?.steps??0),sumFrom=d=>ds.filter(x=>x.step_date>=d&&x.step_date<=today).reduce((a,x)=>a+Number(x.steps??0),0);
document.getElementById("todaySteps").textContent=stepOf(today).toLocaleString();document.getElementById("yesterdaySteps").textContent=stepOf(yesterday).toLocaleString();document.getElementById("weekSteps").textContent=sumFrom(weekStart).toLocaleString();document.getElementById("monthSteps").textContent=sumFrom(monthStart).toLocaleString();
r=await sb.from("game_progress").select("cycle,current_target_id,current_steps,carry_steps,random_pass_used,random_skipped_target_id,random_current_target_id").eq("user_id",currentUser.id).maybeSingle();if(r.error){console.error(r.error);showError("ゲーム進行データを取得できませんでした");return}gameProgress=r.data;if(!gameProgress){showError("game_progressの初期データがありません");return}document.getElementById("carrySteps").textContent=Number(gameProgress.carry_steps??0).toLocaleString();
r=await sb.from("targets").select("id,category,name_ja,name_en,country,height_m,required_steps").order("id");if(r.error){console.error(r.error);showError("目標データを取得できませんでした");return}allTargets=r.data??[];
r=await sb.from("target_completions").select("target_id").eq("user_id",currentUser.id).eq("cycle",gameProgress.cycle??1);if(r.error){console.error(r.error);showError("クリア履歴を取得できませんでした");return}completedTargetIds=new Set((r.data??[]).map(x=>x.target_id));
let b=0,m=0;for(const t of allTargets){if(!completedTargetIds.has(t.id))continue;if(t.category==="building")b++;if(t.category==="mountain")m++}document.getElementById("completedTotal").textContent=completedTargetIds.size;document.getElementById("completedBuildings").textContent=b;document.getElementById("completedMountains").textContent=m;displayCurrentChallenge();updateSelectionButtons();if(!keepStatus)status.textContent="Supabaseとの接続は正常です";}
function updateSelectionButtons(){const mb=document.getElementById("manualButton"),rb=document.getElementById("randomButton"),nb=document.getElementById("nextCycleButton"),s=document.getElementById("selectionStatus");nb.classList.add("hidden");mb.classList.remove("hidden");rb.classList.remove("hidden");if(gameProgress?.current_target_id){mb.disabled=rb.disabled=true;rb.textContent="ランダムで選ぶ";s.textContent="現在の目標をクリアすると次を選べます";return}if(completedTargetIds.size>=100){mb.disabled=rb.disabled=true;mb.classList.add("hidden");rb.classList.add("hidden");nb.classList.remove("hidden");nb.textContent=`${Number(gameProgress.cycle??1)+1}周目を開始`;s.textContent="100 / 100 制覇達成！ 次の周回は0歩から始まります";return}if(gameProgress?.random_current_target_id){mb.disabled=true;rb.disabled=false;rb.textContent="ランダム抽選を続ける";s.textContent=gameProgress.random_pass_used?"再抽選された目標が確定しています":"抽選中の目標があります";return}mb.disabled=rb.disabled=false;rb.textContent="ランダムで選ぶ";s.textContent="";}
function displayCurrentChallenge(){const id=gameProgress?.current_target_id;if(!id){document.getElementById("currentTargetName").textContent="まだ選択されていません";document.getElementById("currentTargetInfo").textContent="";document.getElementById("progressBar").classList.add("hidden");document.getElementById("floorMeterWrap").classList.add("hidden");return}const t=allTargets.find(x=>x.id===id);if(!t)return;const cur=Number(gameProgress.current_steps??0),req=Number(t.required_steps),remain=Math.max(req-cur,0),pct=Math.min(cur/req*100,100);document.getElementById("currentTargetName").textContent=targetDisplayName(t);document.getElementById("currentTargetInfo").innerHTML=`${escapeHtml(targetCountry(t))}<br>高さ：${Number(t.height_m).toLocaleString()}m<br>${cur.toLocaleString()} / ${req.toLocaleString()}歩（達成率 ${Math.round(cur/req*100)}％）<br>あと ${remain.toLocaleString()}歩`;document.getElementById("progressBar").classList.remove("hidden");document.getElementById("progressFill").style.width=pct+"%";const floors=FLOOR_COUNTS[t.id];const fw=document.getElementById("floorMeterWrap");if(floors){const reached=Math.min(Math.floor(floors*cur/req),floors),pos=Math.max(6,Math.min(pct,88));fw.classList.remove("hidden");document.getElementById("floorCurrent").textContent=`${reached}階`;document.getElementById("floorCurrent").style.left=pos+"%";document.getElementById("floorTotal").textContent=`${floors}階`;document.getElementById("floorFill").style.width=pct+"%"}else fw.classList.add("hidden");}
function openTargetList(){if(gameProgress?.current_target_id||gameProgress?.random_current_target_id)return;currentFilter="all";updateFilterButtons();renderTargetList();showScreen("targetScreen");}
function setFilter(f){currentFilter=f;updateFilterButtons();renderTargetList();}
function updateFilterButtons(){const b={all:document.getElementById("filterAll"),building:document.getElementById("filterBuilding"),mountain:document.getElementById("filterMountain")};for(const[k,v]of Object.entries(b))v.className=k===currentFilter?"filter-active":"filter-inactive";}
function renderTargetList(){
  const list=document.getElementById("targetList");list.innerHTML="";
  const targets=allTargets.filter(x=>currentFilter==="all"||x.category===currentFilter).sort((a,b)=>{
    const ad=completedTargetIds.has(a.id),bd=completedTargetIds.has(b.id);
    if(ad!==bd)return ad?1:-1;
    return a.id-b.id;
  });
  for(const t of targets){
    const done=completedTargetIds.has(t.id),item=document.createElement("div");
    item.className="target-item"+(done?" completed":"");
    item.innerHTML=`<div class="target-item-name">${escapeHtml(targetDisplayName(t))}</div><div class="target-item-details">${t.category==="building"?"建造物":"山"}・${escapeHtml(targetCountry(t))}<br>高さ ${Number(t.height_m).toLocaleString()}m・${Number(t.required_steps).toLocaleString()}歩</div>${done?'<div class="completed-label">制覇済み</div>':""}`;
    if(!done)item.onclick=()=>selectTarget(t.id);
    list.appendChild(item);
  }
}
function selectTarget(id){if(completedTargetIds.has(id))return;selectedTarget=allTargets.find(x=>x.id===id);if(!selectedTarget)return;document.getElementById("confirmName").textContent=targetDisplayName(selectedTarget);document.getElementById("confirmDetails").innerHTML=`${escapeHtml(targetCountry(selectedTarget))}<br>高さ：${Number(selectedTarget.height_m).toLocaleString()}m<br>必要歩数：${Number(selectedTarget.required_steps).toLocaleString()}歩`;document.getElementById("confirmStatus").textContent="";showScreen("confirmScreen");}
async function openRandomTarget(){if(gameProgress?.current_target_id)return;if(gameProgress?.random_current_target_id){randomTarget=allTargets.find(t=>t.id===gameProgress.random_current_target_id);if(!randomTarget)return;displayRandomTarget();showScreen("randomScreen");return}const c=allTargets.filter(t=>!completedTargetIds.has(t.id));if(!c.length)return;const t=c[Math.floor(Math.random()*c.length)];const{error}=await sb.from("game_progress").update({random_current_target_id:t.id,random_pass_used:false,random_skipped_target_id:null,updated_at:new Date().toISOString()}).eq("user_id",currentUser.id).is("current_target_id",null).is("random_current_target_id",null);if(error){console.error(error);alert("抽選結果を保存できませんでした");return}gameProgress.random_current_target_id=t.id;gameProgress.random_pass_used=false;gameProgress.random_skipped_target_id=null;randomTarget=t;updateSelectionButtons();displayRandomTarget();showScreen("randomScreen");}
function displayRandomTarget(){if(!randomTarget)return;document.getElementById("randomName").textContent=targetDisplayName(randomTarget);document.getElementById("randomDetails").innerHTML=`${randomTarget.category==="building"?"建造物":"山"}・${escapeHtml(targetCountry(randomTarget))}<br>高さ：${Number(randomTarget.height_m).toLocaleString()}m<br>必要歩数：${Number(randomTarget.required_steps).toLocaleString()}歩`;const used=!!gameProgress?.random_pass_used;document.getElementById("passButton").classList.toggle("hidden",used);document.getElementById("mustChallengeMessage").classList.toggle("hidden",!used);document.getElementById("randomBadge").textContent=used?"再抽選":"ランダム抽選";document.getElementById("randomQuestion").textContent=used?"この目標に挑戦します":"この目標に挑戦しますか？";}
async function passRandomTarget(){if(!randomTarget||gameProgress?.random_pass_used)return;const skipped=randomTarget.id,c=allTargets.filter(t=>!completedTargetIds.has(t.id)&&t.id!==skipped);if(!c.length){document.getElementById("randomStatus").textContent="再抽選できる目標がありません";return}const t=c[Math.floor(Math.random()*c.length)];const{error}=await sb.from("game_progress").update({random_pass_used:true,random_skipped_target_id:skipped,random_current_target_id:t.id,updated_at:new Date().toISOString()}).eq("user_id",currentUser.id).is("current_target_id",null).eq("random_current_target_id",skipped).eq("random_pass_used",false);if(error){console.error(error);document.getElementById("randomStatus").textContent="パスを登録できませんでした";return}gameProgress.random_pass_used=true;gameProgress.random_skipped_target_id=skipped;gameProgress.random_current_target_id=t.id;randomTarget=t;updateSelectionButtons();displayRandomTarget();}
async function startChallenge(){if(!selectedTarget)return;const ok=await saveChallenge(selectedTarget,document.getElementById("confirmStatus"),false);if(!ok)return;selectedTarget=null;await normalizeAfterChallengeStart();showScreen("mainScreen",{replace:true});}
async function startRandomChallenge(){if(!randomTarget)return;const ok=await saveChallenge(randomTarget,document.getElementById("randomStatus"),true);if(!ok)return;randomTarget=null;await normalizeAfterChallengeStart();showScreen("mainScreen",{replace:true});}
async function normalizeAfterChallengeStart(){const{error}=await sb.rpc("apply_unapplied_steps");if(error)console.error(error);await loadData(true);}
async function saveChallenge(t,s,fromRandom){s.className="status";s.textContent="登録しています...";const{data:latest,error:checkError}=await sb.from("game_progress").select("current_target_id,random_current_target_id").eq("user_id",currentUser.id).single();if(checkError){s.className="status error";s.textContent="進行状態を確認できませんでした";return false}if(latest.current_target_id){s.className="status error";s.textContent="すでに挑戦中の目標があります";return false}if(fromRandom&&latest.random_current_target_id!==t.id){s.className="status error";s.textContent="抽選結果が一致しません";return false}if(!fromRandom&&latest.random_current_target_id){s.className="status error";s.textContent="ランダム抽選中の目標があります";return false}const{error}=await sb.rpc("start_target_challenge",{p_target_id:t.id});if(error){console.error(error);s.className="status error";s.textContent="挑戦を開始できませんでした";return false}return true;}
async function prepareNextCycle(){const nb=document.getElementById("nextCycleButton"),s=document.getElementById("selectionStatus");nb.disabled=true;s.className="status";s.textContent="次の周回を準備しています...";const{data,error}=await sb.rpc("prepare_next_cycle");if(error){console.error(error);nb.disabled=false;s.className="status error";s.textContent="次の周回を開始できませんでした";return}stepsAppliedThisLoad=false;await loadData(true);s.className="status success";s.textContent=`${Number(data?.new_cycle??gameProgress?.cycle??1)}周目を準備しました。最初の目標に挑戦した瞬間がスタート日時になります。`;}
async function openHistory(){showScreen("historyScreen");const status=document.getElementById("historyStatus");status.className="status";status.textContent="履歴を読み込んでいます...";const [cyclesRes,compRes]=await Promise.all([sb.from("game_cycles").select("cycle,started_at,completed_at").eq("user_id",currentUser.id).order("cycle",{ascending:true}),sb.from("target_completions").select("target_id,cycle,completed_at").eq("user_id",currentUser.id).order("completed_at",{ascending:false})]);if(cyclesRes.error||compRes.error){console.error(cyclesRes.error||compRes.error);status.className="status error";status.textContent="履歴を取得できませんでした";return}renderCycleHistory(cyclesRes.data??[]);renderLatestTargetHistory(compRes.data??[]);status.textContent="";}
function renderCycleHistory(rows){const box=document.getElementById("cycleHistory");box.innerHTML="";if(!rows.length){box.innerHTML='<div class="card empty">正式スタート前です</div>';return}for(const r of rows){const el=document.createElement("div");el.className="card";el.innerHTML=`<div class="cycle-title">${Number(r.cycle)}周目</div><div class="details">スタート日：${formatDate(r.started_at)}<br>全クリア日：${r.completed_at?formatDate(r.completed_at):"―"}</div>`;box.appendChild(el);}}
function renderLatestTargetHistory(rows){
  const latest=new Map(),counts=new Map();
  for(const r of rows){
    counts.set(r.target_id,(counts.get(r.target_id)||0)+1);
    if(!latest.has(r.target_id))latest.set(r.target_id,r);
  }
  const box=document.getElementById("targetHistory");box.innerHTML="";
  const targets=[...allTargets].sort((a,b)=>{
    const ad=(counts.get(a.id)||0)>0,bd=(counts.get(b.id)||0)>0;
    if(ad!==bd)return ad?1:-1;
    return a.id-b.id;
  });
  for(const t of targets){
    const r=latest.get(t.id),count=counts.get(t.id)||0,el=document.createElement("div");
    let colorClass="";
    if(count===1)colorClass=" history-once";
    else if(count===2)colorClass=" history-twice";
    else if(count>=3)colorClass=" history-three-plus";
    el.className="target-item"+colorClass;
    el.innerHTML=`<div class="history-row"><div><div class="target-item-name">${escapeHtml(targetDisplayName(t))}</div><div class="target-item-details">${t.category==="building"?"建造物":"山"}・${escapeHtml(targetCountry(t))}<br>高さ ${Number(t.height_m).toLocaleString()}m</div>${count>0?`<div class="history-count">制覇 ${count}回</div>`:""}</div><div class="history-date">${r?`最新制覇：${formatDate(r.completed_at)}`:"未制覇"}</div></div>`;
    box.appendChild(el);
  }
}
function collectionTargets(c){if(c.ids)return c.ids.map(id=>allTargets.find(t=>t.id===id)).filter(Boolean);return allTargets.filter(c.filter);}
function openCollections(){renderCollections();showScreen("collectionScreen");}
function renderCollections(){const box=document.getElementById("collectionList");box.innerHTML="";for(const c of COLLECTIONS){const ts=collectionTargets(c).sort((a,b)=>Number(a.height_m)-Number(b.height_m)),done=ts.filter(t=>completedTargetIds.has(t.id)).length,complete=ts.length>0&&done===ts.length,el=document.createElement("div");el.className="collection-card";el.innerHTML=`<div class="collection-title">${escapeHtml(c.name)}${complete?'<span class="collection-complete">COMPLETE</span>':''}</div><div class="collection-condition">クリア条件：${escapeHtml(c.condition)}</div><div class="collection-progress">${done} / ${ts.length}</div><div class="collection-items">${ts.map(t=>`<div class="collection-item ${completedTargetIds.has(t.id)?'collection-done':''}">${completedTargetIds.has(t.id)?'✅':'⬜'} ${escapeHtml(targetDisplayName(t))}　${Number(t.height_m).toLocaleString()}m</div>`).join('')}</div>`;box.appendChild(el);}}

function formatDate(v){if(!v)return"―";return new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(v));}
function scrollToBottom(){window.scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"});}
function scrollToTop(){window.scrollTo({top:0,behavior:"smooth"});}
function leaveRandomScreen(){randomTarget=null;updateSelectionButtons();showScreen("mainScreen");}function backToMain(){selectedTarget=null;showScreen("mainScreen");}function backToTargetList(){selectedTarget=null;renderTargetList();showScreen("targetScreen");}
function escapeHtml(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
function showError(m){const s=document.getElementById("appStatus");s.className="status error";s.textContent=m;}
</script>
